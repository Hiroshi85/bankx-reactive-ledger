spring:
  application:
    name: bankx-reactive-ledger
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/bankx}
  datasource:
    url: ${LEGACY_DB_URL:jdbc:h2:mem:legacy;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

server:
  port: ${SERVER_PORT:8080}

risk:
  base-url: ${RISK_BASE_URL:http://localhost:8089}
  timeout: ${RISK_TIMEOUT:500ms}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:  
    health:
      probes:
        enabled: true
